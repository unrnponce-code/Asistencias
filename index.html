<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asistencia UNRN</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f7f6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    width:90%;
    max-width:450px;
    text-align:center;
}

.logo{
    font-size:36px;
    font-weight:bold;
    color:#00A88E;
    margin-bottom:10px;
}

.subtitulo{
    color:#555;
    margin-bottom:30px;
    font-size:16px;
    line-height:1.5;
}

input{
    width:100%;
    padding:14px;
    font-size:16px;
    border:2px solid #d9e5e2;
    border-radius:10px;
    box-sizing:border-box;
    transition:0.2s;
}

input:focus{
    outline:none;
    border-color:#00A88E;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00A88E;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#008F79;
}

.mensaje{
    margin-top:20px;
    font-weight:bold;
    line-height:1.5;
}

.ok{
    color:#00A88E;
}

.error{
    color:#d32f2f;
}

.info{
    color:#555;
}

.footer{
    margin-top:25px;
    font-size:12px;
    color:#888;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
UNRN
</div>

<div class="subtitulo">
Universidad Nacional de Río Negro<br>
Sistema de Asistencia
</div>

<input
type="number"
id="dni"
placeholder="Ingresá tu DNI"
>

<button onclick="registrar()">
Registrar asistencia
</button>

<div id="mensaje" class="mensaje"></div>

<div class="footer">
Asistencia digital para estudiantes
</div>

</div>

<script>

async function registrar(){

    const mensaje = document.getElementById("mensaje");
    const dni = document.getElementById("dni").value;

    if(!dni){

        mensaje.className = "mensaje error";
        mensaje.innerHTML = "Ingresá tu DNI.";

        return;
    }

    mensaje.className = "mensaje info";
    mensaje.innerHTML = "Solicitando ubicación...";

    if(!navigator.geolocation){

        mensaje.className = "mensaje error";
        mensaje.innerHTML = "Tu navegador no permite geolocalización.";

        return;
    }

    navigator.geolocation.getCurrentPosition(

        async function(position){

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            mensaje.className = "mensaje info";
            mensaje.innerHTML = "Validando asistencia...";

            try{

                const response = await fetch(
                    "https://hook.us2.make.com/gh4qyu4rg8cbesrxcnnjfqs92974erub",
                    {
                        method:"POST",
                        headers:{
                            "Content-Type":"application/json"
                        },
                        body:JSON.stringify({
                            dni:dni,
                            lat:lat,
                            lng:lng,
                            accuracy:accuracy,
                            fecha:new Date().toISOString()
                        })
                    }
                );

                const data = await response.json();

                if(data.status === "ok"){

                    mensaje.className = "mensaje ok";
                    mensaje.innerHTML = data.message;

                }

                else if(data.status === "duplicado"){

                    mensaje.className = "mensaje info";
                    mensaje.innerHTML = data.message;

                }

                else if(data.status === "ubicacion"){

                    mensaje.className = "mensaje error";
                    mensaje.innerHTML = data.message;

                }

                else if(data.status === "registro"){

                    window.location.href = data.redirect_url;

                }

                else{

                    mensaje.className = "mensaje error";
                    mensaje.innerHTML = "Respuesta desconocida del servidor.";

                }

            }
            catch(error){

                mensaje.className = "mensaje error";
                mensaje.innerHTML = "No se pudo conectar con el servidor.";

            }

        },

        function(error){

            mensaje.className = "mensaje error";

            switch(error.code){

                case error.PERMISSION_DENIED:
                    mensaje.innerHTML = "Debés permitir el acceso a la ubicación para registrar asistencia.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    mensaje.innerHTML = "No fue posible obtener tu ubicación.";
                    break;

                case error.TIMEOUT:
                    mensaje.innerHTML = "Se agotó el tiempo para obtener la ubicación.";
                    break;

                default:
                    mensaje.innerHTML = "Ocurrió un error al obtener la ubicación.";

            }

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}

</script>

</body>
</html>
