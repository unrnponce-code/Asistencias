<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asistencia UNRN - Contabilidad</title>

<style>

:root{
    --unrn-red:#B5121B;
    --unrn-red-dark:#991019;
    --unrn-gray:#444444;
    --unrn-light:#f5f5f5;
    --success:#2e7d32;
    --error:#c62828;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--unrn-light);
    font-family:Arial, sans-serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.logo{
    width:280px;
    max-width:100%;
    margin-bottom:25px;
}

.titulo{
    font-size:24px;
    font-weight:bold;
    color:var(--unrn-gray);
    margin-bottom:10px;
}

.materia{
    display:inline-block;
    background:var(--unrn-red);
    color:white;
    padding:10px 20px;
    border-radius:50px;
    font-weight:bold;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    font-size:16px;
    border:2px solid #d9d9d9;
    border-radius:12px;
    transition:0.2s;
}

input:focus{
    outline:none;
    border-color:var(--unrn-red);
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--unrn-red);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:var(--unrn-red-dark);
}

.mensaje{
    margin-top:20px;
    font-weight:bold;
    line-height:1.5;
}

.ok{
    color:var(--success);
}

.error{
    color:var(--error);
}

.info{
    color:var(--unrn-gray);
}

.footer{
    margin-top:30px;
    font-size:12px;
    color:#888;
}

</style>

</head>

<body>

<div class="card">

<img src="logo-unrn.png" alt="UNRN" class="logo">

<div class="titulo">
Sistema de Asistencia Académica
</div>

<div class="materia">
CLASE DE CONTABILIDAD
</div>

<input
type="number"
id="dni"
placeholder="Ingresá tu DNI"
>

<button onclick="registrar()">
Registrar asistencia
</button>

<div id="mensaje" class="mensaje"></div>

<div class="footer">
Universidad Nacional de Río Negro
</div>

</div>

<script>

async function registrar(){

    const mensaje = document.getElementById("mensaje");
    const dni = document.getElementById("dni").value;

    if(!dni){

        mensaje.className = "mensaje error";
        mensaje.innerHTML = "Ingresá tu DNI.";

        return;
    }

    mensaje.className = "mensaje info";
    mensaje.innerHTML = "Solicitando ubicación...";

    if(!navigator.geolocation){

        mensaje.className = "mensaje error";
        mensaje.innerHTML = "Tu navegador no permite geolocalización.";

        return;
    }

    navigator.geolocation.getCurrentPosition(

        async function(position){

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            mensaje.className = "mensaje info";
            mensaje.innerHTML = "Validando asistencia...";

            try{

                const response = await fetch(
                    "https://hook.us2.make.com/gh4qyu4rg8cbesrxcnnjfqs92974erub",
                    {
                        method:"POST",
                        headers:{
                            "Content-Type":"application/json"
                        },
                        body:JSON.stringify({
                            dni:dni,
                            lat:lat,
                            lng:lng,
                            accuracy:accuracy,
                            fecha:new Date().toISOString()
                        })
                    }
                );

                const data = await response.json();

                if(data.status === "ok"){

                    mensaje.className = "mensaje ok";
                    mensaje.innerHTML = data.message;

                }

                else if(data.status === "duplicado"){

                    mensaje.className = "mensaje info";
                    mensaje.innerHTML = data.message;

                }

                else if(data.status === "ubicacion"){

                    mensaje.className = "mensaje error";
                    mensaje.innerHTML = data.message;

                }

                else if(data.status === "200"){

                    window.location.href = data.redirect_url;

                }

                else{

                    mensaje.className = "mensaje error";
                    mensaje.innerHTML = "Respuesta desconocida del servidor.";

                }

            }
            catch(error){

                mensaje.className = "mensaje error";
                mensaje.innerHTML = "No se pudo conectar con el servidor.";

            }

        },

        function(error){

            mensaje.className = "mensaje error";

            switch(error.code){

                case error.PERMISSION_DENIED:
                    mensaje.innerHTML = "Debés permitir el acceso a la ubicación.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    mensaje.innerHTML = "No fue posible obtener la ubicación.";
                    break;

                case error.TIMEOUT:
                    mensaje.innerHTML = "Tiempo agotado al obtener la ubicación.";
                    break;

                default:
                    mensaje.innerHTML = "Error al obtener la ubicación.";

            }

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}

</script>

</body>
</html>
