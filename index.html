<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistencia</title>
</head>

<body>

<script>

document.addEventListener("DOMContentLoaded", async function () {

  let deviceId = localStorage.getItem("uni_device_id");

  if (!deviceId) {
    deviceId = "UNI-" + Math.random().toString(36).substring(2, 12);
    localStorage.setItem("uni_device_id", deviceId);
  }

  const webhookUrl = "https://hook.us2.make.com/gh4qyu4rg8cbesrxcnnjfqs92974erub";

  try {

    const response = await fetch(webhookUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        device_id: deviceId,
        fecha: new Date().toISOString(),
        navegador: navigator.userAgent
      })
    });

    const data = await response.json();

    if (data.redirect_url) {
      window.location.href = data.redirect_url;
    } else {

      document.body.innerHTML = `
        <div style="font-family: Arial; text-align:center; margin-top:80px;">
          <h2>Error</h2>
          <p>No se recibió URL de redirección.</p>
        </div>
      `;

    }

  } catch (error) {

    document.body.innerHTML = `
      <div style="font-family: Arial; text-align:center; margin-top:80px;">
        <h2>Error al registrar asistencia</h2>
        <p>Intentá nuevamente o avisale al profesor.</p>
      </div>
    `;

  }

});

</script>

</body>
</html>
